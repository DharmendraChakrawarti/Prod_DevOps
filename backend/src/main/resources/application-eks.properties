# ==============================================================
#  Spring Boot Application Properties — EKS Profile
# ==============================================================
#  Activated when: SPRING_PROFILES_ACTIVE=eks
#
#  This profile configures the application for running in an
#  EKS (Kubernetes) environment with:
#    - Actuator endpoints exposed for Prometheus scraping
#    - Detailed health check info for liveness/readiness probes
#    - Graceful shutdown for zero-downtime rolling deployments
# ==============================================================

# ---- Actuator Endpoints ----
# Expose health, info, Prometheus metrics, and general metrics
# These are used by:
#   - Kubernetes for liveness/readiness probes (/actuator/health)
#   - Prometheus for metrics scraping (/actuator/prometheus)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# ---- Graceful Shutdown ----
# Allow in-flight requests to complete before the pod is terminated.
# Kubernetes sends SIGTERM and waits terminationGracePeriodSeconds (default 30s)
# before force-killing the pod — this ensures clean shutdown.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
