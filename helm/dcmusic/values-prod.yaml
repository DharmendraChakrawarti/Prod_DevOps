# ============================================================
# DC Music — Prod environment overrides
# Usage: helm install dcmusic ./helm/dcmusic -f helm/dcmusic/values-prod.yaml
# ============================================================

backend:
  replicaCount: 3

  resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 60

  env:
    SPRING_PROFILES_ACTIVE: "aws"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    APP_CORS_ALLOWED_ORIGINS: "*"

  pdb:
    enabled: true
    minAvailable: 2

frontend:
  replicaCount: 3

  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

  pdb:
    enabled: true
    minAvailable: 2

ingress:
  enabled: true

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
