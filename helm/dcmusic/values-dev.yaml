# ============================================================
# DC Music — Dev environment overrides
# Usage: helm install dcmusic ./helm/dcmusic -f helm/dcmusic/values-dev.yaml
# ============================================================

backend:
  replicaCount: 1

  resources:
    requests:
      memory: "128Mi"
      cpu: "125m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  autoscaling:
    enabled: false

  env:
    SPRING_PROFILES_ACTIVE: "dev"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    APP_CORS_ALLOWED_ORIGINS: "*"

  pdb:
    enabled: false

frontend:
  replicaCount: 1

  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"

  autoscaling:
    enabled: false

  pdb:
    enabled: false

ingress:
  enabled: false

monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
