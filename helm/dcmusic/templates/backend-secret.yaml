# Replace placeholder values before deploying, or use External Secrets Operator.
# Example using External Secrets: https://external-secrets.io/
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dcmusic.fullname" . }}-backend-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dcmusic.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: {{ .Values.backend.secret.SPRING_DATASOURCE_URL | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.backend.secret.SPRING_DATASOURCE_USERNAME | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.backend.secret.SPRING_DATASOURCE_PASSWORD | quote }}
