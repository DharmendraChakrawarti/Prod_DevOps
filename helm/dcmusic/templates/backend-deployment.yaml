apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dcmusic.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dcmusic.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "dcmusic.backend.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "dcmusic.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dcmusic.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: {{ .Values.backend.securityContext.runAsNonRoot }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dcmusic.fullname" . }}-backend-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dcmusic.fullname" . }}-backend-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
            - name: APP_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "dcmusic.fullname" . }}-backend-config
                  key: APP_CORS_ALLOWED_ORIGINS
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcmusic.fullname" . }}-backend-secret
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcmusic.fullname" . }}-backend-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dcmusic.fullname" . }}-backend-secret
                  key: SPRING_DATASOURCE_PASSWORD
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.backend.securityContext.readOnlyRootFilesystem }}
          {{- if .Values.backend.uploads.enabled }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.backend.uploads.mountPath }}
          {{- end }}
      {{- if .Values.backend.uploads.enabled }}
      volumes:
        - name: uploads
          {{- if .Values.backend.uploads.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dcmusic.fullname" . }}-backend-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
