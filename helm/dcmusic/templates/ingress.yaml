{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dcmusic.fullname" . }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dcmusic.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "dcmusic.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: {{ include "dcmusic.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dcmusic.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
