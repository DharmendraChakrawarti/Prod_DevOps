apiVersion: v1
kind: Service
metadata:
  name: {{ include "dcmusic.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dcmusic.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "dcmusic.frontend.selectorLabels" . | nindent 4 }}
