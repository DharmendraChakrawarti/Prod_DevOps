# ============================================================
# TEMPLATE / EXAMPLE — Replace with real values or use
# External Secrets Operator to pull from AWS Secrets Manager.
# ============================================================
# To create this secret with real values:
#   kubectl create secret generic dcmusic-backend-secret \
#     --namespace dcmusic \
#     --from-literal=SPRING_DATASOURCE_URL='jdbc:mysql://<RDS_ENDPOINT>:3306/dcmusic' \
#     --from-literal=SPRING_DATASOURCE_USERNAME='admin' \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<YOUR_PASSWORD>'
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: dcmusic-backend-secret
  namespace: dcmusic
  labels:
    app.kubernetes.io/name: dcmusic
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:mysql://REPLACE_RDS_ENDPOINT:3306/dcmusic"
  SPRING_DATASOURCE_USERNAME: "REPLACE_USERNAME"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_PASSWORD"
